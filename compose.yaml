services:
  vault:
    image: hashicorp/vault:1.15
    container_name: careflow_vault
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - vault_data:/vault/file
      - vault_token:/vault/token
      - ./infra/vault/config:/vault/config:ro
      - ./infra/vault/scripts/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    networks:
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8200/v1/sys/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.50"

  db:
    image: postgres:16-alpine
    container_name: careflow_db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.50"

  redis:
    image: redis:7-alpine
    container_name: careflow_redis
    restart: unless-stopped
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - data-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careflow_backend
    restart: unless-stopped
    environment:
      DJANGO_DEBUG: "${DJANGO_DEBUG:-1}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}"
      DJANGO_ASGI_APP: "${DJANGO_ASGI_APP:-config.asgi:application}"
    volumes:
      - django_static:/app/staticfiles
      - vault_token:/vault/token:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy
    networks:
      - data-net
      - app-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.75"

  nginx:
    build:
      context: ./infra/nginx
      dockerfile: Dockerfile
    container_name: careflow_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/conf.d/default.conf:/etc/nginx/templates/conf.d/default.conf.template:ro
      - ./infra/nginx/modsecurity/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:/etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:ro
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
      - django_static:/var/www/static:ro
    depends_on:
      - backend
    networks:
      - app-net
      - public-net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.50"

volumes:
  postgres_data:
  redis_data:
  django_static:
  vault_data:
  vault_token:

networks:
  public-net:
  app-net:
  data-net:
    internal: true
