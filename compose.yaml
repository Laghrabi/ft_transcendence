services:
  db:
    image: postgres:16-alpine
    container_name: careflow_db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.50"

  redis:
    image: redis:7-alpine
    container_name: careflow_redis
    restart: unless-stopped
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - data-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careflow_backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - django_static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - data-net
      - app-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.75"

  nginx:
    build:
      context: ./infra/nginx
      dockerfile: Dockerfile
    container_name: careflow_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - django_static:/var/www/static:ro
    depends_on:
      - backend
    networks:
      - app-net
      - public-net
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  django_static:
    driver: local

networks:
  public-net:
    driver: bridge
  app-net:
    driver: bridge
  data-net:
    driver: bridge
    internal: true
