services:
  vault:
    image: hashicorp/vault:1.15
    container_name: careflow_vault
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - vault_data:/vault/file
      - vault_token:/vault/token
      - ./infra/vault/config:/vault/config:ro
      - ./infra/vault/scripts/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    networks:
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8200/v1/sys/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.50"

  db:
    image: postgres:16-alpine
    container_name: careflow_db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.50"

  redis:
    image: redis:7-alpine
    container_name: careflow_redis
    restart: unless-stopped
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - data-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careflow_backend
    restart: unless-stopped
    environment:
      DJANGO_DEBUG: "${DJANGO_DEBUG}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS}"
      DJANGO_ASGI_APP: "${DJANGO_ASGI_APP}"
    volumes:
      - django_static:/app/staticfiles
      - vault_token:/vault/token:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy
    networks:
      - data-net
      - app-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.75"

  nginx:
    build:
      context: ./infra/nginx
      dockerfile: Dockerfile
    container_name: careflow_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/conf.d/default.conf:/etc/nginx/templates/conf.d/default.conf.template:ro
      - ./infra/nginx/modsecurity/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:/etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:ro
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
      - django_static:/var/www/static:ro
    depends_on:
      - backend
    networks:
      - app-net
      - public-net
      - monitoring-net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.50"

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: careflow_prometheus
    restart: unless-stopped
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    networks:
      - monitoring-net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  grafana:
    image: grafana/grafana:10.4.0
    container_name: careflow_grafana
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      GF_SERVER_ROOT_URL: "https://localhost/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitoring-net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: careflow_cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.20"

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: careflow_node_exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
    networks:
      - monitoring-net
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.10"

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: careflow_postgres_exporter
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_SOURCE_URI: "db:5432/${POSTGRES_DB}?sslmode=disable"
      DATA_SOURCE_USER: "${POSTGRES_USER}"
      DATA_SOURCE_PASS: "${POSTGRES_PASSWORD}"
    networks:
      - monitoring-net
      - data-net
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.10"

volumes:
  postgres_data:
  redis_data:
  django_static:
  vault_data:
  vault_token:
  prometheus_data:
  grafana_data:

networks:
  public-net:
  app-net:
  data-net:
    internal: true
  monitoring-net:
