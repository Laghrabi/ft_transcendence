name: CareFlow CI

on:
  push:
    paths: &shared_paths
      - 'backend/**'
      - 'infra/nginx/**'
      - 'compose.yaml'
      - '.env.example'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]
    paths: *shared_paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  selective-ci:
    name: Selective Fast CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Detect which subsystems were edited in this push / PR
      - name: Detect Changed Paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            nginx:
              - 'infra/nginx/**'
            compose:
              - 'compose.yaml'
              - '.env.example'
              - '.github/workflows/ci.yml'

      # Secrets hygiene check runs instantaneously (<1s) to prevent leaks to protected branches
      - name: Check for Committed Secrets or Private Keys
        run: |
          echo "Scanning git index for forbidden secret files..."
          if git ls-files | grep -E '(\.env$|\.env\.local$|\.key$|\.pem$)'; then
            echo "ERROR: Tracked secrets or private keys detected in git index!"
            exit 1
          fi
          echo "No secret files detected in repository."

      # Prepare environment template so all docker compose commands find valid variables
      - name: Prepare Environment File
        run: cp .env.example .env

      # Fast syntax validation of Docker Compose structure
      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet
          echo "Docker compose configuration is valid."

      - name: Validate DevOps Required Files
        run: |
          test -f infra/nginx/Dockerfile
          test -f infra/nginx/nginx.conf
          test -f infra/nginx/conf.d/default.conf
          echo "Required DevOps files are present."

      # Build backend image only if backend or compose files changed
      - name: Build Backend Image
        if: steps.filter.outputs.backend == 'true' || steps.filter.outputs.compose == 'true'
        run: |
          echo "Building backend Docker image..."
          docker compose build backend

      # Build Nginx image only if Nginx reverse proxy configuration or compose changed
      - name: Build Nginx Image
        if: steps.filter.outputs.nginx == 'true' || steps.filter.outputs.compose == 'true'
        run: |
          echo "Building Nginx Docker image..."
          docker compose build nginx
          nginx_image="$(docker compose config --images | grep 'nginx$' | head -n 1)"
          test -n "$nginx_image"
          docker run --rm --add-host backend:127.0.0.1 "$nginx_image" nginx -t

