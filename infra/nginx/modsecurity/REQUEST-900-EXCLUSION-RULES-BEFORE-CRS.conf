# 1. Bypass WAF engine for Grafana (PromQL queries trigger false positives)
SecRule REQUEST_URI "@rx ^/grafana(/|$)" "id:1001,phase:1,pass,nolog,ctl:ruleEngine=Off"

# 2. Allow Django CSRF tokens without false-positive SQLi alerts
SecRuleUpdateTargetById 942100 "!REQUEST_HEADERS:X-CSRFToken"
SecRuleUpdateTargetById 942100 "!REQUEST_COOKIES:csrftoken"
SecRuleUpdateTargetById 942100 "!ARGS:csrfmiddlewaretoken"

# 3. Allow REST API methods (PUT, PATCH, DELETE) required by Django
SecAction "id:1005,phase:1,pass,nolog,setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE'"
