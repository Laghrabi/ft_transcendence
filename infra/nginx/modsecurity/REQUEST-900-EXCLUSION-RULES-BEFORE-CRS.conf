# 1. Allow WebSockets on /ws/ without protocol violation alert
SecRule REQUEST_URI "@beginsWith /ws/" "id:1001,phase:1,pass,nolog,ctl:ruleEngine=Off"

# 2. Allow Django CSRF tokens without false-positive SQLi alerts
SecRuleUpdateTargetById 942100 "!REQUEST_HEADERS:X-CSRFToken"
SecRuleUpdateTargetById 942100 "!REQUEST_COOKIES:csrftoken"

# 3. Allow Grafana response bodies without false-positive leakage alerts
SecRule REQUEST_URI "@beginsWith /grafana/" "id:1003,phase:1,pass,nolog,ctl:ruleRemoveByTag=attack-disclosure"

# 4. Allow PromQL queries in Grafana datasource endpoint without false-positive SQLi alerts
SecRule REQUEST_URI "@beginsWith /grafana/api/ds/query" "id:1004,phase:1,pass,nolog,ctl:ruleRemoveById=942100"

