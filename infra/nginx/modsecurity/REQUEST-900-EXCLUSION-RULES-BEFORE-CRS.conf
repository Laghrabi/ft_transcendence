# 1. Allow WebSockets on /ws/ without protocol violation alert
SecRule REQUEST_URI "@beginsWith /ws/" "id:1001,phase:1,pass,nolog,ctl:ruleEngine=Off"

# 2. Allow Django CSRF tokens without false-positive SQLi alerts
SecRuleUpdateTargetById 942100 "!REQUEST_HEADERS:X-CSRFToken"
SecRuleUpdateTargetById 942100 "!REQUEST_COOKIES:csrftoken"
